name: Weekly model update

on:
  schedule:
    # Mondays and Thursdays, 12:00 UTC — catches each week's tournament finish.
    - cron: "0 12 * * 1,4"
  workflow_dispatch: {}  # manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the model
        run: python3 -m model.pipeline

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/model_output.json
          if git diff --cached --quiet; then
            echo "No model changes this run."
            exit 0
          fi
          git commit -m "data: refresh model output ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push
